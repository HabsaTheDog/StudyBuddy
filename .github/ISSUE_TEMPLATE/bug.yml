name: Bug report
description: Report a reproducible Study Buddy defect using synthetic or redacted data.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or attach credentials, private URLs, portal captures, student data, or course downloads here. Use private vulnerability reporting for security issues.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest steps using synthetic data.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node, browser, Typst/Poppler, and relevant adapter.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private URLs, IDs, student data, authenticated captures, and restricted course content.
          required: true
