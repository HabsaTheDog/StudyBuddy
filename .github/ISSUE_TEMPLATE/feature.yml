name: Feature proposal
description: Propose a bounded improvement or institution adapter.
title: "[Feature]: "
labels: ["type:feature", "status:needs-design"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What student problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Describe the smallest useful change and what remains out of scope.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Security, privacy, and permission impact
      description: Cover data sources, network access, storage, consequential actions, and deletion.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation plan
      description: Explain synthetic fixtures, tests, and success criteria.
    validations:
      required: true
