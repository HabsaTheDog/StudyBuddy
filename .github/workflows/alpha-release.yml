name: Alpha desktop artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer prerelease without the v prefix
        required: true
        default: 0.1.0-alpha.1
        type: string
      signed:
        description: Require Windows code signing (blocked until SignPath onboarding is complete)
        required: true
        default: false
        type: boolean
      publish_draft:
        description: Publish a draft GitHub prerelease from an existing matching tag
        required: true
        default: false
        type: boolean

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16
          cache: npm
      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5
        with:
          typst-version: 0.15.0
      - name: Validate release contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_DRAFT: ${{ inputs.publish_draft }}
          SIGNED: ${{ inputs.signed }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module -e '
            const version = process.env.RELEASE_VERSION ?? "";
            if (!/^0\.1\.0-alpha\.[1-9][0-9]*$/.test(version)) {
              throw new Error(`Expected an alpha version such as 0.1.0-alpha.1, received: ${version}`);
            }
            if (process.env.SIGNED === "true") {
              throw new Error("Signed Windows builds remain disabled until the reviewed SignPath integration is configured.");
            }
            if (process.env.PUBLISH_DRAFT === "true") {
              const expectedRef = `refs/tags/v${version}`;
              if (process.env.RELEASE_REF !== expectedRef) {
                throw new Error(`Draft publication must run from ${expectedRef}.`);
              }
              if (process.env.SIGNED !== "true") {
                throw new Error("Draft publication requires a signed Windows artifact.");
              }
            }
          '
      - run: npm ci
      - name: Install release-validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npx playwright install --with-deps chromium
      - run: npm run check:release

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            os: windows-latest
            platform: win
            target: nsis
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16
      - name: Install pinned UI workspace
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          cd t3code-fork
          pnpm install --frozen-lockfile
      - name: Build Study Buddy desktop artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$RELEASE_VERSION"
            --output-dir "$RUNNER_TEMP/study-buddy-release"
          )
          cd t3code-fork
          pnpm dist:desktop:artifact "${args[@]}"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/study-buddy-release/*.AppImage
            ${{ runner.temp }}/study-buddy-release/*.AppImage.blockmap
            ${{ runner.temp }}/study-buddy-release/*.exe
            ${{ runner.temp }}/study-buddy-release/*.exe.blockmap
            ${{ runner.temp }}/study-buddy-release/*.yml
            ${{ runner.temp }}/study-buddy-release/*.yaml
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - run: npm ci
      - name: Verify updater payload is complete
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f \( -name 'alpha.yml' -o -name 'alpha-linux.yml' \) | wc -l)" -eq 2
          grep -Eq '^version: 0\.1\.0-alpha\.[1-9][0-9]*$' release-assets/alpha.yml
          grep -Eq '^version: 0\.1\.0-alpha\.[1-9][0-9]*$' release-assets/alpha-linux.yml
          grep -Eq 'sha512:' release-assets/alpha.yml
          grep -Eq 'sha512:' release-assets/alpha-linux.yml
      - name: Generate production SBOM and immutable release manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SIGNED: ${{ inputs.signed }}
          ROOT_SHA: ${{ github.sha }}
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx > release-assets/study-buddy-root.cdx.json
          UI_SHA="$(git ls-tree HEAD t3code-fork | awk '{print $3}')"
          export UI_SHA
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const manifest = {
              schemaVersion: 1,
              product: "Study Buddy",
              version: process.env.RELEASE_VERSION,
              rootCommit: process.env.ROOT_SHA,
              uiCommit: process.env.UI_SHA,
              supportedPlatforms: ["linux-x64", "windows-x64"],
              signed: process.env.RELEASE_SIGNED === "true",
              generatedBy: "GitHub Actions",
            };
            writeFileSync("release-assets/release-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync("release-assets/study-buddy-root.cdx.json", "utf8")); if(value.bomFormat!=="CycloneDX" || !value.components?.length) process.exit(1)'
          cd release-assets
          sha256sum -- * > SHA256SUMS
      - name: Upload complete release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: study-buddy-${{ inputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Publish draft prerelease
    if: inputs.publish_draft
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: alpha-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: study-buddy-${{ inputs.version }}
          path: release-assets
      - name: Publish reviewed draft from the exact existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          notes="docs/releases/v${RELEASE_VERSION}.md"
          test -s "$notes"
          gh release create "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Study Buddy v${RELEASE_VERSION}" \
            --notes-file "$notes" \
            --draft \
            --prerelease \
            release-assets/*
