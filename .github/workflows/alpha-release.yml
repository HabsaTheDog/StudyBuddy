name: Desktop release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable, alpha, or beta SemVer without the v prefix
        required: true
        default: 1.0.0
        type: string
      signed:
        description: Require Windows code signing (blocked until SignPath onboarding is complete)
        required: true
        default: false
        type: boolean
      acknowledge_unsigned_windows:
        description: Acknowledge that the published Windows installer is unsigned and will trigger trust warnings
        required: true
        default: false
        type: boolean
      publish_draft:
        description: Publish a draft GitHub release from an existing matching tag
        required: true
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      channel: ${{ steps.contract.outputs.channel }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16
          cache: npm
      - uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v5
        with:
          typst-version: 0.15.0
      - name: Validate release contract
        id: contract
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_DRAFT: ${{ inputs.publish_draft }}
          SIGNED: ${{ inputs.signed }}
          ACKNOWLEDGE_UNSIGNED_WINDOWS: ${{ inputs.acknowledge_unsigned_windows }}
          RELEASE_REF: ${{ github.ref }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: node scripts/check-desktop-release-contract.mjs
      - run: npm ci
      - name: Install release-validation tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npx playwright install --with-deps chromium
      - run: npm run check:release
      - name: Audit the exact shipped UI dependency graph
        working-directory: t3code-fork
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm study-buddy:audit

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            platform: linux
            artifact_os: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            os: windows-2025
            platform: win
            artifact_os: windows
            target: nsis
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Install pinned UI workspace
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          cd t3code-fork
          pnpm install --frozen-lockfile
      - name: Build Study Buddy desktop artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          APP_VERSION: ${{ inputs.version }}
          STUDY_BUDDY_ROOT: ${{ github.workspace }}
          STUDY_BUDDY_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "$RELEASE_VERSION"
            --output-dir "$RUNNER_TEMP/study-buddy-release"
          )
          cd t3code-fork
          pnpm dist:desktop:artifact "${args[@]}"
          generic_sbom="$RUNNER_TEMP/study-buddy-release/study-buddy-desktop.cdx.json"
          platform_sbom="$RUNNER_TEMP/study-buddy-release/study-buddy-desktop-${{ matrix.artifact_os }}-x64.cdx.json"
          if [ -s "$generic_sbom" ]; then
            mv "$generic_sbom" "$platform_sbom"
          fi
          test -s "$platform_sbom"
      - name: Confirm Windows installer is intentionally unsigned
        if: matrix.platform == 'win' && inputs.signed == false
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "$env:RUNNER_TEMP/study-buddy-release" -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Expected an intentionally unsigned Windows installer, received Authenticode status $($signature.Status)."
          }
          "Confirmed unsigned Windows installer: $($installers[0].Name)"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/study-buddy-release/*.AppImage
            ${{ runner.temp }}/study-buddy-release/*.AppImage.blockmap
            ${{ runner.temp }}/study-buddy-release/*.exe
            ${{ runner.temp }}/study-buddy-release/*.exe.blockmap
            ${{ runner.temp }}/study-buddy-release/${{ needs.preflight.outputs.channel }}.yml
            ${{ runner.temp }}/study-buddy-release/${{ needs.preflight.outputs.channel }}-linux.yml
            ${{ runner.temp }}/study-buddy-release/study-buddy-desktop-*-x64.cdx.json
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble release evidence
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - run: npm ci
      - name: Verify updater payload is complete
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
        run: node scripts/check-desktop-release-assets.mjs release-assets "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Generate production SBOM and immutable release manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SIGNED: ${{ inputs.signed }}
          ROOT_SHA: ${{ github.sha }}
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx > release-assets/study-buddy-root.cdx.json
          UI_SHA="$(git ls-tree HEAD t3code-fork | awk '{print $3}')"
          export UI_SHA
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const manifest = {
              schemaVersion: 1,
              product: "Study Buddy",
              version: process.env.RELEASE_VERSION,
              rootCommit: process.env.ROOT_SHA,
              uiCommit: process.env.UI_SHA,
              supportedPlatforms: ["linux-x64", "windows-x64"],
              signed: process.env.RELEASE_SIGNED === "true",
              generatedBy: "GitHub Actions",
            };
            writeFileSync("release-assets/release-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          '
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync("release-assets/study-buddy-root.cdx.json", "utf8")); if(value.bomFormat!=="CycloneDX" || !value.components?.length) process.exit(1)'
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cd ..
          node scripts/check-desktop-release-assets.mjs release-assets "$RELEASE_VERSION" "${{ needs.preflight.outputs.channel }}" --final
      - name: Upload complete release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: study-buddy-${{ inputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Publish draft release
    if: inputs.publish_draft
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: study-buddy-${{ inputs.version }}
          path: release-assets
      - name: Publish reviewed draft from the exact existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          notes="docs/releases/v${RELEASE_VERSION}.md"
          test -s "$notes"

          tag_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}"
          tag_type="$(gh api "$tag_ref" --jq '.object.type')"
          tag_sha="$(gh api "$tag_ref" --jq '.object.sha')"
          while [ "$tag_type" = "tag" ]; do
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            tag_type="$(jq -r '.object.type' <<<"$tag_object")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag v${RELEASE_VERSION} resolves to ${tag_type}:${tag_sha}, expected commit:${GITHUB_SHA}." >&2
            exit 1
          fi

          release_flags=(--draft)
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi

          gh release create "v${RELEASE_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Study Buddy v${RELEASE_VERSION}" \
            --notes-file "$notes" \
            "${release_flags[@]}" \
            release-assets/*
