name: Codex runtime compatibility

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src/custom-skills/moodle/**
      - .github/workflows/codex-runtime.yml
  push:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
      - src/custom-skills/moodle/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify SDK and bundled CLI pairing
        run: npm run moodle:doctor -- --version-only --json

