name: Codex runtime compatibility

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
      - .env.example
      - scripts/**
      - src/custom-skills/moodle/**
      - src/custom-skills/web-layout/**
      - src/custom-skills/interactive-study-guide/**
      - src/custom-skills/shared/**
      - .github/workflows/codex-runtime.yml
  push:
    branches:
      - master
    paths:
      - package.json
      - package-lock.json
      - tsconfig.json
      - vitest.config.ts
      - .env.example
      - scripts/**
      - src/custom-skills/moodle/**
      - src/custom-skills/web-layout/**
      - src/custom-skills/interactive-study-guide/**
      - src/custom-skills/shared/**
      - .github/workflows/codex-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux document and browser tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          sudo snap install typst
          npx playwright install --with-deps chromium
      - name: Install macOS document and browser tooling
        if: runner.os == 'macOS'
        run: |
          brew install poppler typst
          npx playwright install chromium
      - name: Install Windows document and browser tooling
        if: runner.os == 'Windows'
        run: |
          choco install poppler typst -y --no-progress
          npx playwright install chromium
      - run: npm run typecheck
      - run: npm test
        env:
          WEB_LAYOUT_BROWSER_TESTS: "1"
      - name: Verify SDK and bundled CLI pairing
        run: npm run moodle:doctor -- --version-only --json
