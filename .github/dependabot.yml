version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    # Major upgrades can change the SDK/compiler contract and require a
    # dedicated compatibility review instead of an automated maintenance PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      codex-runtime:
        applies-to: "version-updates"
        patterns:
          - "@openai/codex-sdk"
          - "@openai/codex"
      production-minor-and-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      development-minor-and-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    groups:
      workflow-security:
        applies-to: "security-updates"
        patterns:
          - "*"
      workflow-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 2
